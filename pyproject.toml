[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-auto-publisher"
version = "1.0.0"
description = "Free AI news digests, GitHub Pages and private email drafts"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1", "feedparser>=6.0,<7", "pydantic>=2.11,<3",
  "PyYAML>=6,<7", "rapidfuzz>=3.12,<4", "Jinja2>=3.1.6,<4",
  "Pillow>=12,<13", "beautifulsoup4>=4.13,<5", "google-genai>=2.3,<3", "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
setup = ["PyNaCl>=1.5,<2"]

[project.scripts]
ai-news = "ai_news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
