name: News Publisher
on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Shanghai
    - cron: '0 20 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: 'run / preview / redeploy / send / regenerate / check-sources'
        type: choice
        options: [run, preview, redeploy, send, regenerate, check-sources]
        default: preview
      issue:
        description: 'Manual live operations require YYYY-MM-DD-am or YYYY-MM-DD-pm'
        type: string
        default: ''
      resend:
        description: 'Explicitly resend, including already accepted or uncertain mail'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ai-news-publisher
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ai-news preview
  source-health:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ai-news check-sources --enforce
  publish:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.PUBLISHER_ENABLED == 'true' && vars.PUBLISHER_PAUSED != 'true' &&
      (github.event_name == 'schedule' || (inputs.mode != 'preview' && inputs.mode != 'check-sources'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      PUBLISHER_PAUSED: ${{ vars.PUBLISHER_PAUSED || 'false' }}
      AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: npm ci --ignore-scripts
      - run: python scripts/bootstrap_data.py
      - name: Resolve and freeze issue
        id: issue
        env:
          RUN_MODE: ${{ inputs.mode || 'run' }}
          REQUESTED_ISSUE: ${{ inputs.issue }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_FREE_TIER_CONFIRMED: ${{ vars.AI_FREE_TIER_CONFIRMED || 'false' }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '1' }}
          GEMINI_TPM: ${{ vars.GEMINI_TPM || '16000' }}
          GEMINI_RPD: ${{ vars.GEMINI_RPD || '10' }}
        run: python scripts/workflow_issue.py
      - name: Build public site
        id: build
        if: steps.issue.outputs.ready == 'true' && inputs.mode != 'send'
        env:
          RUN_MODE: ${{ inputs.mode || 'run' }}
        run: ai-news --data .runtime/data build-site
      - name: Package only audited public site
        id: package
        if: steps.issue.outputs.ready == 'true' && steps.build.outcome == 'success'
        run: |
          ai-news audit-site --output site
          tar --directory site --create --file "$RUNNER_TEMP/artifact.tar" .
      - name: Upload only audited public site
        id: upload
        if: steps.issue.outputs.ready == 'true' && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy Pages
        id: deploy
        if: steps.upload.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify deployment and send private email
        if: always() && !cancelled() && steps.issue.outputs.ready == 'true'
        env:
          ISSUE: ${{ steps.issue.outputs.issue }}
          RUN_MODE: ${{ inputs.mode || 'run' }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RESEND: ${{ inputs.resend || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/workflow_notify.py
